<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#367e83"><meta name="description" content="A modern personal school planner for schedules, tasks and subject notebooks">
<link rel="manifest" href="manifest.json"><title>School Planner</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-mark">SP</div><div class="brand-text"><b>School Planner</b><span>My study space</span></div><button class="icon-btn side-collapse" id="sideCollapse" aria-label="Collapse sidebar">‹</button></div>
    <div class="workspace"><span class="avatar" id="userAvatar">J</span><div><b id="workspaceName">My Workspace</b><small id="workspaceEmail">Personal planner</small></div><button class="auth-btn" id="authButton" aria-label="Sign in" title="Sign in">Sign in</button></div>
    <nav class="nav" aria-label="Main navigation">
      <button class="nav-item active" data-view="dashboard"><span>⌂</span><b>Dashboard</b></button>
      <button class="nav-item" data-view="calendar"><span>▦</span><b>Calendar</b></button>
      <button class="nav-item" data-view="tasks"><span>✓</span><b>Tasks</b><em id="overdueBadge" hidden>0</em></button>
      <button class="nav-item" data-view="subjects"><span>▤</span><b>My Subjects</b></button>
      <button class="nav-item" data-view="notes"><span>✎</span><b>Notes</b></button>
    </nav>
    <div class="sidebar-bottom">
      <button class="nav-item" data-view="settings"><span>⚙</span><b>Settings</b></button>
      <div class="save-indicator" id="saveIndicator"><i></i><span>Saved on this device</span></div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <header class="topbar">
      <div class="top-left"><button class="icon-btn mobile-menu" id="mobileMenu" aria-label="Open menu">☰</button><div><span class="eyebrow" id="eyebrow">Overview</span><h1 id="pageTitle">Dashboard</h1></div></div>
      <div class="top-actions"><button class="search-btn" id="globalSearchBtn">⌕ <span>Search</span><kbd>Ctrl K</kbd></button><button class="icon-btn" id="themeToggle" title="Toggle dark mode">☾</button><button class="primary small" id="quickAdd">+ Quick add</button></div>
    </header>
    <div class="content" id="content">
      <section class="view active" id="view-dashboard"></section>
      <section class="view" id="view-calendar"></section>
      <section class="view" id="view-tasks"></section>
      <section class="view" id="view-subjects"></section>
      <section class="view" id="view-notes"></section>
      <section class="view" id="view-settings"></section>
    </div>
  </main>
</div>
<div class="auth-backdrop" id="authModal" hidden>
  <div class="auth-modal" role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <div class="auth-modal-head">
      <div><span class="eyebrow">School Planner</span><h2 id="authTitle">Sign in to your planner</h2></div>
      <button class="icon-btn" id="authClose" type="button" aria-label="Close">×</button>
    </div>
    <div class="auth-modal-body">
      <button class="google-auth-btn" id="googleAuthBtn" type="button"><span class="google-g">G</span> Continue with Google</button>
      <div class="auth-divider"><span>or</span></div>
      <div class="auth-tabs" id="authTabs">
        <button type="button" class="auth-tab active" data-auth-mode="login">Log in</button>
        <button type="button" class="auth-tab" data-auth-mode="register">Create account</button>
      </div>
      <form id="emailAuthForm" class="auth-form">
        <label>Email<input id="authEmail" type="email" autocomplete="email" required placeholder="you@example.com"></label>
        <label>Password<input id="authPassword" type="password" autocomplete="current-password" required placeholder="Your password"></label>
        <label id="authConfirmWrap" hidden>Confirm password<input id="authPassword2" type="password" autocomplete="new-password" placeholder="Repeat your password"></label>
        <button class="primary auth-submit" id="emailAuthSubmit" type="submit">Log in</button>
        <button class="auth-forgot" id="authForgot" type="button">Forgot password?</button>
        <div class="auth-message" id="authMessage" role="alert"></div>
      </form>
      <p class="auth-note">Sign in to sync your calendar, tasks, subjects, and notes across devices.</p>
    </div>
  </div>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}</script>
</body>
</html>
