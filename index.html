<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#367e83"><meta name="description" content="A modern personal school planner for schedules, tasks and subject notebooks">
<link rel="manifest" href="manifest.json"><title>School Planner</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-mark">SP</div><div class="brand-text"><b>School Planner</b><span>My study space</span></div><button class="icon-btn side-collapse" id="sideCollapse" aria-label="Collapse sidebar">‹</button></div>
    <div class="workspace"><span class="avatar" id="userAvatar">J</span><div><b id="workspaceName">My Workspace</b><small id="workspaceEmail">Personal planner</small></div></div>
    <nav class="nav" aria-label="Main navigation">
      <button class="nav-item active" data-view="dashboard"><span>⌂</span><b>Dashboard</b></button>
      <button class="nav-item" data-view="calendar"><span>▦</span><b>Calendar</b></button>
      <button class="nav-item" data-view="tasks"><span>✓</span><b>Tasks</b><em id="overdueBadge" hidden>0</em></button>
      <button class="nav-item" data-view="subjects"><span>▤</span><b>My Subjects</b></button>
      <button class="nav-item" data-view="notes"><span>✎</span><b>Notes</b></button>
    </nav>
    <div class="sidebar-bottom">
      <button class="nav-item" data-view="settings"><span>⚙</span><b>Settings</b></button>
      <button class="auth-btn full" id="authButton" aria-label="Sign in" title="Sign in">Sign in</button>
      <div class="save-indicator" id="saveIndicator"><i></i><span>Saved on this device</span></div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <header class="topbar">
      <div class="top-left"><button class="icon-btn mobile-menu" id="mobileMenu" aria-label="Open menu">☰</button><div><span class="eyebrow" id="eyebrow">Overview</span><h1 id="pageTitle">Dashboard</h1></div></div>
      <div class="top-actions"><button class="search-btn" id="globalSearchBtn">⌕ <span>Search</span><kbd>Ctrl K</kbd></button><button class="icon-btn" id="themeToggle" title="Toggle dark mode">☾</button><button class="primary small" id="quickAdd">+ Quick add</button></div>
    </header>
    <div class="content" id="content">
      <section class="view active" id="view-dashboard"></section>
      <section class="view" id="view-calendar"></section>
      <section class="view" id="view-tasks"></section>
      <section class="view" id="view-subjects"></section>
      <section class="view" id="view-notes"></section>
      <section class="view" id="view-settings"></section>
    </div>
  </main>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}</script>
</body>
</html>
