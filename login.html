<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#367e83"><meta name="description" content="Sign in to JASync">
<title>Sign in – JASync</title>
<link rel="icon" type="image/png" href="logo.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="stylesheet" href="styles.css">
<style>body{min-height:100vh;display:grid;place-items:center;padding:16px}.login-shell{width:min(440px,100%)}.login-shell .auth-modal{width:100%}.login-back{position:absolute;top:18px;left:18px}.login-shell .auth-modal-head{justify-content:flex-start;align-items:center;gap:14px}.login-logo{width:52px;height:52px;flex:none;border-radius:11px;box-shadow:0 7px 18px rgba(54,126,131,.25)}.login-shell .auth-modal-head h2{margin:2px 0 0}.login-shell .auth-modal-head .eyebrow{text-transform:none;letter-spacing:.02em}</style>
</head>
<body>
<a class="icon-btn login-back" href="index.html" aria-label="Back to home" title="Back to home">‹</a>
<div class="login-shell">
  <div class="auth-modal">
    <div class="auth-modal-head"><img class="login-logo" src="logo.png" alt="JASync logo">
      <div><span class="eyebrow">JASync</span><h2 id="authTitle">Sign in to your planner</h2></div>
    </div>
    <div class="auth-modal-body">
      <button class="google-auth-btn" id="googleAuthBtn" type="button"><span class="google-g">G</span> Continue with Google</button>
      <div class="auth-divider"><span>or</span></div>
      <div class="auth-tabs" id="authTabs">
        <button type="button" class="auth-tab active" data-auth-mode="login">Log in</button>
        <button type="button" class="auth-tab" data-auth-mode="register">Create account</button>
      </div>
      <form id="emailAuthForm" class="auth-form">
        <label>Email<input id="authEmail" type="email" autocomplete="email" required placeholder="you@example.com"></label>
        <label>Password<input id="authPassword" type="password" autocomplete="current-password" required placeholder="Your password"></label>
        <label id="authConfirmWrap" hidden>Confirm password<input id="authPassword2" type="password" autocomplete="new-password" placeholder="Repeat your password"></label>
        <button class="primary auth-submit" id="emailAuthSubmit" type="submit">Log in</button>
        <button class="auth-forgot" id="authForgot" type="button">Forgot password?</button>
        <div class="auth-message" id="authMessage" role="alert"></div>
      </form>
      <p class="auth-note">Sign in to sync your calendar, tasks, subjects, and notes across devices.</p>
    </div>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="login.js"></script>
</body>
</html>
